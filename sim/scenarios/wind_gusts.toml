name = "wind_gusts"
description = "Hover at 1.5 m in 3 m/s wind with turbulence and two 4 m/s gusts"
duration_s = 35
seed = 5

[[setpoints]]
t = 0.0
altitude_m = 0.0

[[setpoints]]
t = 1.0
altitude_m = 1.5

[wind]
mean_mps = [3.0, 0.0, 0.0]
turbulence_sigma_mps = [0.8, 0.8, 0.3]
turbulence_tau_s = 1.5

[[wind.gusts]]
t = 15.0
duration_s = 2.0
peak_mps = [0.0, 4.0, 0.0]

[[wind.gusts]]
t = 25.0
duration_s = 1.5
peak_mps = [-4.0, 0.0, -1.0]

[[criteria]]
metric = "height_rmse_m"
max = 0.25
window = [8, 35]

[[criteria]]
metric = "tilt_max_deg"
max = 25.0
window = [5, 35]

[[criteria]]
metric = "est_tilt_error_max_deg"
estimator = "active"
max = 3.0
window = [5, 35]
